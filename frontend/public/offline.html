<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Mahmoud Adel Portfolio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f3efe7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(90vw, 420px);
        text-align: center;
      }
      img {
        width: 88px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 10px;
      }
      p {
        color: #a8a29e;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-white.svg" alt="Mahmoud Adel" />
      <h1>You are offline</h1>
      <p>The portfolio app is installed, but this page needs a connection to refresh the latest work and dashboard data.</p>
    </main>
  </body>
</html>
